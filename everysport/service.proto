syntax = "proto3";

package ttab.everysport;

option go_package = "github.com/ttab/elephant-tt-api/everysport";

service Manage {
  // ManualImport re-imports calendar events based on a search query.
  rpc ManualImport(ManualImportRequest) returns (ManualImportResponse);
  // ListSports lists the sports in the import configuration.
  rpc ListSports(ListSportsRequest) returns (ListSportsResponse);
  // ListCategories lists competition categories, for one sport or for all of
  // them. A category imports nothing of its own, it carries the defaults that
  // new competitions under it are created with.
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  // ListCompetitions lists competitions in the import configuration.
  rpc ListCompetitions(ListCompetitionsRequest) returns (ListCompetitionsResponse);
  // GetSport returns a single sport configuration.
  rpc GetSport(GetSportRequest) returns (GetSportResponse);
  // GetCompetition returns a single competition configuration.
  rpc GetCompetition(GetCompetitionRequest) returns (GetCompetitionResponse);
  // GetCategory returns a single competition category.
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
  // UpdateSport replaces the editable settings of a sport.
  rpc UpdateSport(UpdateSportRequest) returns (UpdateSportResponse);
  // UpdateCompetition replaces the editable settings of a competition.
  rpc UpdateCompetition(UpdateCompetitionRequest) returns (UpdateCompetitionResponse);
  // UpdateCategory replaces the comment and the import defaults of a
  // competition category.
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  // ApplyDefaults writes the defaults of a sport or a category to the rows
  // below it. With dry_run set it reports what would change and writes
  // nothing, which is what the preview shown before an apply is built from.
  rpc ApplyDefaults(ApplyDefaultsRequest) returns (ApplyDefaultsResponse);
  // ExportConfig returns the full import configuration as CSV.
  rpc ExportConfig(ExportConfigRequest) returns (ExportConfigResponse);
  // ListPendingImports lists the competitions that have calendar entries the
  // service skipped, with the date range those entries fall in.
  rpc ListPendingImports(ListPendingImportsRequest) returns (ListPendingImportsResponse);
  // ReviewCompetitions decides a batch of competitions at once, which is what
  // working through the review queue is.
  rpc ReviewCompetitions(ReviewCompetitionsRequest) returns (ReviewCompetitionsResponse);
}

message ManualImportRequest {
  // FromDate is the date from which to fetch events for import. Optional,
  // defaults to today.
  string from_date  = 1;
  // FromDate is the last date we should get events for. Optional.
  string to_date    = 2;
  // Category only re-imports the events with the specific category.
  int64 category    = 3;
  // Category only re-imports the events for the specific competition static ID.
  int64 competition = 4;
  // Force overwrite of calendar entries.
  bool force        = 5;
  // Competitions only re-imports the events for the given competition static
  // IDs. Combines with competition: an event matches if its static ID is in
  // either. Optional.
  repeated int64 competitions = 6;
}

message ManualImportResponse {
  // QueuedImports is the total numer of events that were queued for import.
  int64 queued_imports = 1;
}

message ListPendingImportsRequest {
  // OnlyEnabled excludes the competitions that wouldn't import anyway, which
  // is every entry that isn't enabled. Optional.
  bool only_enabled = 1;
}

message ListPendingImportsResponse {
  // Imports are the competitions with skipped entries, ordered by sport and
  // competition name.
  repeated PendingImport imports = 1;
}

// PendingImport is a competition with calendar entries that the service saw and
// skipped, because the competition or its sport was not enabled at the time.
// Enabling the competition does not import them: the entries have gone past in
// the update feed, and only a manual import brings them back. An entry stops
// being counted as soon as it is imported, so the list empties itself as the
// re-imports land.
message PendingImport {
  // SportID is the Everysport ID of the sport the competition belongs to.
  int64 sport_id        = 1;
  // SportName is the Everysport sport name.
  string sport_name     = 2;
  // StaticID is the Everysport static ID of the competition.
  int64 static_id       = 3;
  // Name is the Everysport competition name.
  string name           = 4;
  // State is the review state the competition is in now.
  ConfigState state     = 5;
  // FromDate is the date of the earliest skipped entry, as YYYY-MM-DD.
  string from_date      = 6;
  // ToDate is the date of the latest skipped entry, as YYYY-MM-DD.
  string to_date        = 7;
  // Entries is the number of calendar entries that are still missing.
  int64 entries         = 8;
  // LastSeen is when an entry was last skipped, as RFC3339.
  string last_seen      = 9;
  // Queued is how many of the missing entries are on the re-import queue
  // already, waiting for the syncer to reach them. Counted from the queue
  // itself, so it is what is actually pending rather than what was asked for.
  int64 queued          = 10;
}

// ConfigState is the review state of a configuration entry. Entries that the
// service discovers on its own start out as pending.
enum ConfigState {
  // STATE_UNSPECIFIED is the default zero value. Used as "any state" when
  // filtering, and rejected when updating an entry.
  STATE_UNSPECIFIED = 0;
  // STATE_PENDING marks an entry that nobody has reviewed yet. Nothing pending
  // is imported, and the entries that were skipped while it was pending are
  // listed by ListPendingImports.
  STATE_PENDING     = 1;
  // STATE_ENABLED means that matching events are imported.
  STATE_ENABLED     = 2;
  // STATE_DISABLED means that matching events are not imported.
  STATE_DISABLED    = 3;
}

// ImportSettings is the editable part of a sport or competition
// configuration. All other fields identify the entry and are read only.
//
// Nothing here is inherited: a competition is imported with the settings on
// its own row. The settings of a sport are the defaults its new competitions
// are created with, plus its own review state.
message ImportSettings {
  reserved 4;
  reserved "merge_events";

  // State controls whether matching events are imported.
  ConfigState state       = 1;
  // Newsvalue is the value of the core/newsvalue block of created events,
  // 1 to 5. Required when enabling an entry.
  int32 newsvalue         = 2;
  // MergeSetting is the strategy used to group entries into events, and it
  // names the shape of the documents that come out: "NoMerge" gives one event
  // per calendar entry, "CategoryMerge" one event per category and day, and
  // "CompetitionMerge" one event per competition and day. Required when
  // enabling an entry.
  string merge_setting    = 3;
  // Sport is the list of TT media topic names that events are linked to
  // through core/category links, in addition to the generic "Sport" topic.
  // Required when enabling an entry: an entry with no names of its own
  // publishes events linked to the generic topic and nothing else.
  repeated string sport   = 5;
  // Comment is a free text note for whoever configures the import.
  string comment          = 6;
}

// ImportDefaults is the editable part of a competition category. A category
// imports nothing itself, so it has no state: its values are what a
// competition discovered under it is created with, and what ApplyDefaults
// writes downward.
//
// This is deliberately not an ImportSettings. A category with a state field
// would be a field that has to be ignored, and "unset" is a real value here
// where it is not one on a competition: a template can be unset, a field that
// decides what a document says cannot.
message ImportDefaults {
  // Newsvalue is the newsvalue new competitions are created with, 1 to 5.
  // Zero means that no default is set and the sport's is used instead.
  int32 newsvalue       = 1;
  // MergeSetting is the merge strategy new competitions are created with, one
  // of "NoMerge", "CategoryMerge" and "CompetitionMerge". Empty means that no
  // default is set and the sport's is used instead.
  string merge_setting  = 2;
  // Sport is the list of TT media topic names new competitions are created
  // with. Empty means that no default is set and the sport's are used
  // instead.
  repeated string sport = 3;
}

// ConfigWarning is a problem with a configuration entry that doesn't stop it
// from being saved.
message ConfigWarning {
  // Code identifies the kind of problem, f.ex. "unresolved_sport_name".
  string code    = 1;
  // Field is the name of the offending settings field.
  string field   = 2;
  // Message is a human readable description of the problem.
  string message = 3;
}

// SportConfig is the import configuration for an Everysport sport.
message SportConfig {
  // ID is the Everysport sport ID.
  int64 id                     = 1;
  // Name is the Everysport sport name.
  string name                  = 2;
  // Slug is the Everysport sport slug.
  string slug                  = 3;
  // Settings is the editable configuration of the sport.
  ImportSettings settings      = 4;
  // PendingCompetitions is the number of competitions of the sport that are
  // awaiting review.
  int64 pending_competitions   = 5;
  // Seen is when the sport was last listed by Everysport, as RFC3339.
  string seen                  = 6;
  // Updated is when the settings last changed, as RFC3339.
  string updated               = 7;
  // UpdatedBy is the subject that last changed the settings.
  string updated_by            = 8;
}

// CategoryConfig is an Everysport competition category. The category tier
// carries no import settings of its own: it groups competitions under a
// sport, and holds the defaults new competitions in it are created with.
message CategoryConfig {
  // ID is the Everysport competition category ID.
  int64 id                = 1;
  // SportID is the Everysport ID of the sport the category belongs to.
  int64 sport_id          = 2;
  // Name is the Everysport category name.
  string name             = 3;
  // Gender is the gender category slug, if any.
  string gender           = 4;
  // Comment is a free text note for whoever configures the import.
  string comment          = 5;
  // Seen is when the category was last listed by Everysport, as RFC3339.
  string seen             = 6;
  // Updated is when the comment or the defaults last changed, as RFC3339.
  string updated          = 7;
  // UpdatedBy is the subject that last changed them.
  string updated_by       = 8;
  // Defaults are the import defaults for competitions in the category.
  ImportDefaults defaults = 9;
}

// CompetitionConfig is the import configuration for an Everysport
// competition. Competitions are identified by their static ID, the
// competition ID changes between seasons.
message CompetitionConfig {
  // SportID is the Everysport ID of the sport the competition belongs to.
  int64 sport_id          = 1;
  // StaticID is the Everysport static ID of the competition.
  int64 static_id         = 2;
  // CompetitionID is the Everysport competition ID we saw last.
  int64 competition_id    = 3;
  // CategoryID is the Everysport ID of the competition category.
  int64 category_id       = 4;
  // Name is the Everysport competition name.
  string name             = 5;
  // FullName is the full Everysport competition name.
  string full_name        = 6;
  // Gender is the gender category slug, if any.
  string gender           = 7;
  // Settings is the editable configuration of the competition.
  ImportSettings settings = 8;
  // Seen is when the competition was last listed by Everysport, as RFC3339.
  string seen             = 9;
  // Updated is when the settings last changed, as RFC3339.
  string updated          = 10;
  // UpdatedBy is the subject that last changed the settings.
  string updated_by       = 11;
}

message ListSportsRequest {
  // State only returns sports in the given state. Optional.
  ConfigState state = 1;
  // Query only returns sports whose name matches. Optional.
  string query      = 2;
}

message ListSportsResponse {
  // Sports are the matching sports, ordered by name.
  repeated SportConfig sports = 1;
}

message ListCategoriesRequest {
  // SportID is the sport to list categories for. Optional, all sports when
  // left out.
  int64 sport_id = 1;
}

message ListCategoriesResponse {
  // Categories are the matching categories, ordered by sport and name.
  repeated CategoryConfig categories = 1;
}

message ListCompetitionsRequest {
  // SportID only returns competitions for the given sport. Optional.
  int64 sport_id     = 1;
  // CategoryID only returns competitions in the given category. Optional.
  int64 category_id  = 2;
  // State only returns competitions in the given state. Optional.
  ConfigState state  = 3;
  // Query only returns competitions whose name matches. Optional.
  string query       = 4;
  // Stale only returns competitions that Everysport no longer lists.
  bool stale         = 5;
  // Offset is the number of competitions to skip. Optional.
  int64 offset       = 6;
  // Limit is the maximum number of competitions to return. Optional.
  int64 limit        = 7;
}

message ListCompetitionsResponse {
  // Competitions are the matching competitions, ordered by name.
  repeated CompetitionConfig competitions = 1;
  // Total is the number of competitions that match, ignoring offset and
  // limit.
  int64 total                             = 2;
}

message GetSportRequest {
  // ID is the Everysport sport ID. Required.
  int64 id = 1;
}

message GetSportResponse {
  // Sport is the sport configuration.
  SportConfig sport = 1;
}

message GetCompetitionRequest {
  // SportID is the Everysport sport ID. Required.
  int64 sport_id  = 1;
  // StaticID is the Everysport competition static ID. Required.
  int64 static_id = 2;
}

message GetCompetitionResponse {
  // Competition is the competition configuration.
  CompetitionConfig competition = 1;
}

message UpdateSportRequest {
  // ID is the Everysport sport ID. Required.
  int64 id                = 1;
  // Settings replaces the current settings of the sport in full.
  ImportSettings settings = 2;
}

message UpdateSportResponse {
  // Sport is the updated sport configuration.
  SportConfig sport               = 1;
  // Warnings are problems with the saved settings.
  repeated ConfigWarning warnings = 2;
}

message UpdateCompetitionRequest {
  // SportID is the Everysport sport ID. Required.
  int64 sport_id          = 1;
  // StaticID is the Everysport competition static ID. Required.
  int64 static_id         = 2;
  // Settings replaces the current settings of the competition in full.
  ImportSettings settings = 3;
}

message UpdateCompetitionResponse {
  // Competition is the updated competition configuration.
  CompetitionConfig competition   = 1;
  // Warnings are problems with the saved settings.
  repeated ConfigWarning warnings = 2;
}

// CompetitionRef identifies one competition. The static ID is unique on its
// own in practice, but the sport is what the configuration is keyed on.
message CompetitionRef {
  // SportID is the Everysport sport ID. Required.
  int64 sport_id  = 1;
  // StaticID is the Everysport competition static ID. Required.
  int64 static_id = 2;
}

message ReviewCompetitionsRequest {
  // Competitions to decide. Required, and every one of them must exist.
  repeated CompetitionRef competitions = 1;
  // State to put them in. Required, and STATE_PENDING is rejected: this is
  // the call that takes entries out of the review queue.
  ConfigState state                    = 2;
  // Newsvalue to give them. Required when the state is STATE_ENABLED, ignored
  // otherwise.
  int32 newsvalue                      = 3;
}

message ReviewCompetitionsResponse {
  // Updated is the number of competitions that were changed.
  int64 updated                   = 1;
  // Warnings are problems with the settings that were saved.
  repeated ConfigWarning warnings = 2;
}

message GetCategoryRequest {
  // ID is the Everysport competition category ID. Required.
  int64 id = 1;
}

message GetCategoryResponse {
  // Category is the competition category.
  CategoryConfig category = 1;
}

message UpdateCategoryRequest {
  // ID is the Everysport competition category ID. Required.
  int64 id                = 1;
  // Comment replaces the current comment of the category.
  string comment          = 2;
  // Defaults replaces the current import defaults of the category in full.
  ImportDefaults defaults = 3;
}

message UpdateCategoryResponse {
  // Category is the updated category.
  CategoryConfig category         = 1;
  // Warnings are problems with the saved defaults.
  repeated ConfigWarning warnings = 2;
}

// DefaultsTier is the configuration tier a changed row sits in.
enum DefaultsTier {
  // TIER_UNSPECIFIED is the default zero value, and is never returned.
  TIER_UNSPECIFIED = 0;
  // TIER_CATEGORY is a competition category row.
  TIER_CATEGORY    = 1;
  // TIER_COMPETITION is a competition row.
  TIER_COMPETITION = 2;
}

// NewsvalueChange is what an apply does to a newsvalue.
message NewsvalueChange {
  // From is the value the row has now.
  int32 from = 1;
  // To is the value the apply writes.
  int32 to   = 2;
}

// MergeSettingChange is what an apply does to a merge strategy.
message MergeSettingChange {
  // From is the value the row has now.
  string from = 1;
  // To is the value the apply writes.
  string to   = 2;
}

// SportChange is what an apply does to a list of topic names.
message SportChange {
  // From are the names the row has now.
  repeated string from = 1;
  // To are the names the apply writes.
  repeated string to   = 2;
}

// DefaultsChange is one row that an apply changes, with the old and the new
// value of every field that changes on it. A field that isn't being applied,
// or that already holds the value being applied, is left out, and a row where
// nothing would change is not reported at all.
message DefaultsChange {
  // Tier says whether the row is a category or a competition.
  DefaultsTier tier                = 1;
  // SportID is the Everysport ID of the sport the row belongs to.
  int64 sport_id                   = 2;
  // CategoryID is the category itself for a category row, and the category
  // the competition belongs to for a competition row. Zero when a competition
  // has no known category.
  int64 category_id                = 3;
  // CategoryName is the name of that category, empty when there is none.
  string category_name             = 4;
  // StaticID is the Everysport competition static ID, zero for a category.
  int64 static_id                  = 5;
  // Name is the name of the row itself.
  string name                      = 6;
  // State is the review state of a competition row. STATE_UNSPECIFIED for a
  // category row, which has no state of its own.
  ConfigState state                = 7;
  // Newsvalue is the change to the newsvalue, absent when it doesn't change.
  NewsvalueChange newsvalue        = 8;
  // MergeSetting is the change to the merge strategy, absent when it doesn't
  // change.
  MergeSettingChange merge_setting = 9;
  // Sport is the change to the topic names, absent when they don't change.
  SportChange sport                = 10;
}

// ApplyDefaultsRequest writes the defaults of a sport or a category to the
// rows below it. At least one field must be picked, or there is nothing to
// apply. Applying from a sport always writes its categories as well as its
// competitions: the choice on offer is which fields, not which tier.
message ApplyDefaultsRequest {
  // SportID applies the defaults of a sport. Exactly one of sport_id and
  // category_id is required.
  int64 sport_id                          = 1;
  // CategoryID applies the defaults of a category.
  int64 category_id                       = 2;
  // ApplyNewsvalue includes the newsvalue in what is written.
  bool apply_newsvalue                    = 3;
  // ApplyMergeSetting includes the merge strategy in what is written. The
  // merge strategy is part of the identity of the documents a competition
  // publishes, so changing it on an enabled competition leaves the events it
  // has already published behind under their old identifiers.
  bool apply_merge_setting                = 4;
  // ApplySport includes the topic names in what is written.
  bool apply_sport                        = 5;
  // CompetitionStates selects the competitions to write, by review state.
  // Required, at least one, and STATE_UNSPECIFIED is rejected. Categories are
  // not selected by it: they have no state, and applying from a sport always
  // writes them.
  repeated ConfigState competition_states = 6;
  // DryRun reports what would change and writes nothing. The rows it lists
  // are the rows a call without it writes, as of when it ran: a discovery
  // sweep or a review decision landing in between can change them.
  bool dry_run                            = 7;
}

message ApplyDefaultsResponse {
  // Changes are the rows that change, ordered by category and name.
  repeated DefaultsChange changes = 1;
  // Categories is the number of category rows that change.
  int64 categories                = 2;
  // Competitions is the number of competition rows that change.
  int64 competitions              = 3;
  // EnabledCompetitions is how many of those competitions are enabled, which
  // are the rows where an apply changes something that is already published.
  int64 enabled_competitions      = 4;
  // DryRun repeats the flag from the request: false means the changes listed
  // were written.
  bool dry_run                    = 5;
}

message ExportConfigRequest {}

message ExportConfigResponse {
  // CSV is the full configuration as a CSV file.
  bytes csv = 1;
}
